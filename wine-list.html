<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ワインリスト｜洋食だいにんぐなかむら</title>

<style>
  :root{
    --sage:#3E5C50;
    --sage-deep:#2E4A40;
    --gold:#B08D3E;
    --gold-soft:#C9AE6E;
    --bordeaux:#7B3B43;
    --paper:#FBFAF6;
    --card:#FFFFFF;
    --ink:#2B2B28;
    --muted:#7A776D;
    --line:#E2DED2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);
       color:var(--ink);line-height:1.7;}

  /* ===== ヒーロー ===== */
  .hero{background:linear-gradient(168deg,var(--sage-deep) 0%,var(--sage) 100%);
        color:#F4F1E8;text-align:center;
        padding:calc(env(safe-area-inset-top) + 44px) 20px 40px;}
  .hero .shop{font-family:'Shippori Mincho',serif;font-size:12px;
              letter-spacing:.4em;text-indent:.4em;color:var(--gold-soft);}
  .hero h1{font-family:'Shippori Mincho',serif;font-weight:600;font-size:32px;
           letter-spacing:.3em;text-indent:.3em;margin:12px 0 6px;}
  .hero .en{font-family:'Cormorant Garamond',serif;font-size:13px;
            letter-spacing:.5em;text-indent:.5em;color:var(--gold-soft);}
  .hero .lead{font-size:13px;font-weight:400;color:#E4E2D8;max-width:300px;
              margin:18px auto 0;}
  .hero .dia{width:8px;height:8px;border:1px solid var(--gold-soft);
             rotate:45deg;margin:20px auto 0;}

  /* ===== 3杯以上1割引の帯 ===== */
  .setband{background:#F3EDDD;border-top:1px solid var(--gold);
           border-bottom:1px solid var(--gold);padding:14px 20px;
           text-align:center;}
  .setband .t{font-family:'Shippori Mincho',serif;color:var(--gold);
              font-size:14px;letter-spacing:.24em;}
  .setband p{font-size:13px;font-weight:400;color:var(--ink);margin-top:4px;}

  /* ===== タブ ===== */
  .tabs{position:sticky;top:0;z-index:10;background:var(--paper);
        display:flex;gap:8px;padding:12px 16px;
        border-bottom:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:9px 0;font-size:13px;
       letter-spacing:.14em;font-family:inherit;
       border:1px solid var(--line);border-radius:999px;background:#fff;
       color:var(--muted);cursor:pointer;transition:all .18s ease;}
  .tab.on{background:var(--sage);border-color:var(--sage);color:#fff;}
  .tab.on.red{background:var(--bordeaux);border-color:var(--bordeaux);}
  .tab.on.rose{background:#A6606B;border-color:#A6606B;}
  .sec-title.rose h2{color:#A6606B;}

  /* ===== リスト ===== */
  main{max-width:560px;margin:0 auto;padding:8px 16px 30px;}
  .sec-title{display:flex;align-items:baseline;gap:12px;margin:24px 4px 12px;}
  .sec-title h2{font-family:'Shippori Mincho',serif;font-weight:600;
                font-size:18px;letter-spacing:.22em;color:var(--sage);}
  .sec-title.red h2{color:var(--bordeaux);}
  .sec-title .en{font-family:'Cormorant Garamond',serif;font-style:italic;
                 font-size:13px;color:var(--gold);}
  .sec-title .ln{flex:1;border-top:1px dotted var(--line);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px 16px 14px;margin-bottom:12px;
        box-shadow:0 1px 4px rgba(62,92,80,.05);}
  .c-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;}
  .c-name{font-family:'Shippori Mincho',serif;font-weight:700;font-size:18px;
          line-height:1.45;}
  .c-vint{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:12.5px;color:#55534B;}
  .c-badge{font-size:11px;color:#fff;background:var(--gold);border-radius:3px;
           padding:2px 8px;letter-spacing:.1em;}
  .c-badge.red{background:var(--bordeaux);}
  .c-origin{font-family:'Cormorant Garamond',serif;font-size:12px;
            letter-spacing:.14em;color:var(--gold);text-transform:uppercase;
            margin-top:2px;}
  .c-desc{font-size:14px;font-weight:400;color:#2B2B28;line-height:1.75;margin-top:8px;}
  .c-prices.only{grid-template-columns:1fr;}
  .c-prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
            margin-top:12px;}
  .p-cell{background:var(--paper);border:1px solid var(--line);border-radius:7px;
          text-align:center;padding:7px 2px 6px;}
  .p-cell .l{display:block;font-size:11px;color:#55534B;letter-spacing:.04em;}
  .p-cell .v{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;
             font-size:17px;letter-spacing:.01em;}
  .p-cell.set{background:#F6F1E3;border-color:var(--gold-soft);}
  .p-cell.set .l,.p-cell.set .v{color:var(--gold);}

  .links{max-width:560px;margin:0 auto;padding:6px 16px 28px;}
  .links .cap{text-align:center;font-size:11px;font-weight:300;
              color:var(--muted);letter-spacing:.14em;margin-bottom:10px;}
  .links .btns{display:flex;gap:10px;}
  .link-btn{flex:1;text-align:center;padding:12px 4px;
            border:1px solid var(--sage);border-radius:999px;
            color:var(--sage);text-decoration:none;font-size:13px;
            letter-spacing:.1em;background:#fff;}
  .link-btn:active{background:var(--sage);color:#fff;}
  .back-btn{display:block;text-align:center;margin-top:10px;padding:12px 4px;
            border:1px solid var(--sage);border-radius:999px;
            background:var(--sage);color:#fff;text-decoration:none;
            font-size:13px;letter-spacing:.1em;}
  .back-btn:active{opacity:.72;}

  footer{background:var(--sage-deep);color:#CFCDBF;text-align:center;
         padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);
         font-size:10.5px;font-weight:300;line-height:2;}
  footer .shop{font-family:'Shippori Mincho',serif;font-size:12px;
               letter-spacing:.3em;color:#F4F1E8;margin-bottom:6px;}

  .hidden{display:none;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

const yen=n=>"¥"+n.toLocaleString("ja-JP");

function card(w){
  const badge=w.badge?`<span class="c-badge${w.t==='red'?' red':''}">${w.badge}</span>`:"";
  return `<article class="card" data-t="${w.t}">
    <div class="c-top"><span class="c-name">${w.name}</span><span class="c-vint">${w.v}</span>${badge}</div>
    <div class="c-origin">${w.o}</div>
    <p class="c-desc">${w.d}</p>
    <div class="c-prices${w.p.length===1?' only':''}">
      ${w.p.length===1?"":`<div class="p-cell"><span class="l">グラス50ml</span><span class="v">${yen(w.p[0])}</span></div>
      <div class="p-cell"><span class="l">グラス100ml</span><span class="v">${yen(w.p[1])}</span></div>`}
      <div class="p-cell"><span class="l">ボトル</span><span class="v">${yen(w.p[w.p.length-1])}</span></div>
    </div>
  </article>`;
}

function secTitle(t){
  return t==="white"
    ?`<div class="sec-title" data-t="white"><h2>白ワイン</h2><span class="en">Vin Blanc</span><span class="ln"></span></div>`
    :`<div class="sec-title red" data-t="red"><h2>赤ワイン</h2><span class="en">Vin Rouge</span><span class="ln"></span></div>`;
}

function render(){
  const el=document.getElementById("list");
  const roseSec='<div class="sec-title rose" data-t="rose"><h2>ロゼワイン</h2><span class="en">Vin Ros\u00e9</span><span class="ln"></span></div>';
  const sparkSec='<div class="sec-title" data-t="spark"><h2>スパークリング</h2><span class="en">Vin Mousseux</span><span class="ln"></span></div>';
  el.innerHTML=
    sparkSec+WINES.filter(w=>w.t==="spark").map(card).join("")+
    secTitle("white")+WINES.filter(w=>w.t==="white").map(card).join("")+
    roseSec+WINES.filter(w=>w.t==="rose").map(card).join("")+
    secTitle("red")+WINES.filter(w=>w.t==="red").map(card).join("");
}
render();

document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on","red","rose"));
    b.classList.add("on");
    if(b.dataset.f==="red") b.classList.add("red");
    if(b.dataset.f==="rose") b.classList.add("rose");
    const f=b.dataset.f;
    document.querySelectorAll("[data-t]").forEach(n=>{
      n.classList.toggle("hidden", f!=="all" && n.dataset.t!==f);
    });
    window.scrollTo({top:0,behavior:"smooth"});
  });
});
</script>
