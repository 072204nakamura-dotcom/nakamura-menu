<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>アラカルト｜洋食だいにんぐなかむら</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#3E5C50;
    --sage-deep:#2E4A40;
    --gold:#B08D3E;
    --gold-deep:#96762F;
    --gold-soft:#C9AE6E;
    --paper:#FBFAF6;
    --card:#FFFFFF;
    --ink:#2B2B28;
    --muted:#57544B;
    --line:#E2DED2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);
       color:var(--ink);line-height:1.7;}

  /* ===== ヒーロー ===== */
  .hero{background:linear-gradient(168deg,var(--sage-deep) 0%,var(--sage) 100%);
        color:#F4F1E8;text-align:center;
        padding:calc(env(safe-area-inset-top) + 44px) 20px 40px;}
  .hero .shop{font-family:'Shippori Mincho',serif;font-size:12px;
              letter-spacing:.4em;text-indent:.4em;color:var(--gold-soft);}
  .hero h1{font-family:'Shippori Mincho',serif;font-weight:600;font-size:30px;
           letter-spacing:.26em;text-indent:.26em;margin:12px 0 6px;}
  .hero .en{font-family:'Cormorant Garamond',serif;font-size:13px;
            letter-spacing:.5em;text-indent:.5em;color:var(--gold-soft);}
  .hero .lead{font-size:12px;font-weight:300;color:#D9D9CE;max-width:310px;
              margin:18px auto 0;}
  .hero .dia{width:8px;height:8px;border:1px solid var(--gold-soft);
             rotate:45deg;margin:20px auto 0;}

  /* ===== コース案内の帯 ===== */
  .setband{background:#F3EDDD;border-top:1px solid var(--gold);
           border-bottom:1px solid var(--gold);padding:14px 20px;
           text-align:center;}
  .setband .t{font-family:'Shippori Mincho',serif;color:var(--gold-deep);
              font-size:14px;letter-spacing:.2em;font-weight:600;}
  .setband p{font-size:14px;font-weight:400;color:var(--ink);margin-top:5px;
             max-width:420px;margin-left:auto;margin-right:auto;line-height:1.8;}

  /* ===== リスト ===== */
  main{max-width:560px;margin:0 auto;padding:8px 16px 30px;}
  .sec-title{display:flex;align-items:baseline;gap:12px;margin:24px 4px 12px;}
  .sec-title h2{font-family:'Shippori Mincho',serif;font-weight:600;
                font-size:18px;letter-spacing:.2em;color:var(--sage);}
  .sec-title .en{font-family:'Cormorant Garamond',serif;font-style:italic;
                 font-size:13px;color:var(--gold-deep);}
  .sec-title .ln{flex:1;border-top:1px dotted var(--line);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:15px 16px 14px;margin-bottom:11px;
        box-shadow:0 1px 4px rgba(62,92,80,.05);}
  .c-top{display:flex;align-items:baseline;gap:10px;}
  .c-name{font-family:'Shippori Mincho',serif;font-weight:700;font-size:18px;
          line-height:1.45;}
  .c-price{margin-left:auto;font-family:'Zen Kaku Gothic New',sans-serif;
           font-weight:700;font-size:20px;letter-spacing:.01em;
           white-space:nowrap;color:var(--sage);}
  .c-desc{font-size:14px;font-weight:400;color:var(--muted);margin-top:7px;
          line-height:1.8;}

  /* ===== 関連リンク ===== */
  .links{max-width:560px;margin:0 auto;padding:6px 16px 28px;}
  .links .cap{text-align:center;font-size:11px;font-weight:300;
              color:var(--muted);letter-spacing:.14em;margin-bottom:10px;}
  .links .btns{display:flex;gap:10px;}
  .link-btn{flex:1;min-width:0;text-align:center;padding:12px 4px;
            border:1px solid var(--sage);border-radius:999px;
            color:var(--sage);text-decoration:none;font-size:13px;
            letter-spacing:.1em;background:#fff;}
  .link-btn:active{background:var(--sage);color:#fff;}
  .back-btn{display:block;text-align:center;margin-top:10px;padding:12px 4px;
            border:1px solid var(--sage);border-radius:999px;
            background:var(--sage);color:#fff;text-decoration:none;
            font-size:13px;letter-spacing:.1em;}
  .back-btn:active{opacity:.72;}

  footer{background:var(--sage-deep);color:#CFCDBF;text-align:center;
         padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);
         font-size:10.5px;font-weight:300;line-height:2;}
  footer .shop{font-family:'Shippori Mincho',serif;font-size:12px;
               letter-spacing:.3em;color:#F4F1E8;margin-bottom:6px;}
</style>
</head>
<body>

<header class="hero">
  <div class="shop">洋食だいにんぐ なかむら</div>
  <h1>アラカルト</h1>
  <div class="en">A LA CARTE</div>
  <p class="lead">コースのお料理に、もう一皿。<br>シェアして召し上がるのもおすすめです。</p>
  <div class="dia"></div>
</header>

<div class="setband">
  <div class="t">コースに、もう一皿</div>
  <p>コースのお料理に追加していただける一品です。お腹に余裕のあるとき、シェアして召し上がりたいときにどうぞ。</p>
</div>

<main id="list"></main>

<div class="links">
  <div class="cap">あわせてご覧ください</div>
  <div class="btns">
    <a class="link-btn" href="https://072204nakamura-dotcom.github.io/nakamura-menu/course-menu.html">コースメニュー</a>
    <a class="link-btn" href="https://072204nakamura-dotcom.github.io/nakamura-menu/drink-menu.html">ドリンクメニュー</a>
  </div>
  <a class="back-btn" href="https://072204nakamura-dotcom.github.io/nakamura-menu/menu.html">メニュー一覧へ戻る</a>
</div>

<footer>
  <div class="shop">洋食だいにんぐ なかむら</div>
  広島県安芸郡熊野町<br>
  表示価格はすべて税込です。<br>
  内容は仕入れ状況により変わる場合がございます。
</footer>

<script>
const SECTIONS = [
  { key: "pasta", jp: "パスタ",       en: "Pasta" },
  { key: "side",  jp: "サイドメニュー", en: "Side Dish" }
];

const DISHES = [
  { s:"pasta", name:"きのことベーコンのペペロンチーノ", p:"¥1,200",
    d:"きのことベーコンを、にんにくと唐辛子でシンプルに仕上げました。香りとほのかな辛みが後を引きます。" },
  { s:"pasta", name:"フレッシュトマトとチーズのトマトソース", p:"¥1,200",
    d:"生のトマトの酸味と、とろけるチーズのコク。さっぱりとしていて、コースの後でも召し上がりやすい一皿です。" },
  { s:"pasta", name:"カルボナーラ", p:"¥1,200",
    d:"卵とチーズのまろやかなコク。しっかりとした味わいで、食べごたえのある一皿です。" },
  { s:"pasta", name:"海老のトマトクリームソース", p:"¥1,500",
    d:"海老の旨みをトマトクリームで包み込みました。いちばん濃厚で、満足感のある一皿です。" },
  { s:"side",  name:"チーズの盛り合わせ", p:"¥1,000",
    d:"数種のチーズを少しずつ。ワインのお供に、食後のひとときにどうぞ。" },
  { s:"side",  name:"フライドポテト", p:"¥500",
    d:"揚げたてを熱いうちに。お子さまにも人気の一品です。" }
];

function card(x){
  return `<article class="card">
    <div class="c-top"><span class="c-name">${x.name}</span><span class="c-price">${x.p}</span></div>
    <p class="c-desc">${x.d}</p>
  </article>`;
}

function render(){
  document.getElementById("list").innerHTML = SECTIONS.map(s =>
    `<div class="sec-title"><h2>${s.jp}</h2><span class="en">${s.en}</span><span class="ln"></span></div>` +
    DISHES.filter(x => x.s === s.key).map(card).join("")
  ).join("");
}
render();
</script>
</body>
</html>
